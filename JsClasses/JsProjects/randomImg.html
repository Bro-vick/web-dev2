    </div>
    <script>
        let i = 0;
        let images = ['../../images/image.png', '../../images/lock.png', '../../images/shop.jpeg']
        const interval = setInterval(() => {
            console.log('Executed every 3seconds');
            document.getElementById('randImg').src = images[i];
            i++;    
            if(i == images.length){
                i = 0;
            }
        }, 3000);

        setTimeout(() => clearInterval(interval), 30000);
